name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fhir-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        run: mvn -B verify --file services/fhir-core/pom.xml

  review-copilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/review-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/review-copilot/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Eval harness (accuracy + evidence-contract gate)
        run: python eval/run_eval.py --threshold 0.9
