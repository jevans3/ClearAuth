# ClearAuth open policy catalog (illustrative, authored for this project).
# action: approve = auto-approve
#         review  = approve when claim diagnosis matches an approved ICD-10 prefix, else pend
#         pend    = always route to human clinical review (ClearAuth never auto-denies)
defaultAction: pend

policies:
