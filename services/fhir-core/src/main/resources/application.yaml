spring:
  application:
    name: clearauth-fhir-core
  datasource:
    url: jdbc:h2:mem:clearauth;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    ca.uhn.fhir: warn
